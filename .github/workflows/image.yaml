name: image
on:
  push:
    tags:
    - '*'
jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      EXTRA_TAGS: snapshot
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing and attestations via GitHub OIDC
      attestations: write # store the attestations on GitHub
      artifact-metadata: write # link the image to its registries on GitHub
    steps:
    - name: Configure envvars
      run: |
        GIT_TAG="${GITHUB_REF#refs/tags/}"
        IMAGES=$(
          for repository in ghcr.io/n42-gateway quay.io/n42-gateway; do
            for project in n42-gateway; do
              echo -n "${repository}/${project} "
            done
          done
        )
        TAGS=$(
          for image in $IMAGES; do
            for tag in "$GIT_TAG" ${{ env.EXTRA_TAGS }}; do
              echo -n "${image}:${tag},"
            done
          done
        )
        echo "GIT_TAG=$GIT_TAG" >> $GITHUB_ENV
        echo "IMAGES=$IMAGES" >> $GITHUB_ENV
        echo "TAGS=$TAGS" >> $GITHUB_ENV
    - uses: actions/checkout@v6
    - uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_N42_USR }}
        password: ${{ secrets.QUAY_N42_PWD }}
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: sigstore/cosign-installer@v4.1.2
    - uses: docker/build-push-action@v7
      id: build
      with:
        context: .
        file: builder/Dockerfile
        platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/s390x
        push: true
        # BuildKit attestations, unsigned but listed in the signed image
        # index next to each platform's image: SLSA 1.x provenance (mode=max
        # adds the build args and steps) and an SPDX SBOM of the final image.
        provenance: mode=max,version=v1
        sbom: true
        build-args: |
          GIT_TAG=${{ env.GIT_TAG }}
        tags: ${{ env.TAGS }}
    - name: Sign images
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        for image in $IMAGES; do
          cosign sign --yes --oidc-provider=github-actions "${image}@${DIGEST}"
        done
    # Signed attestations of the image index, stored on GitHub and pushed
    # next to it as OCI referrers. One step per repository: push-to-registry
    # takes a single subject-name. The provenance steps create the storage
    # records, the SBOM ones would duplicate them.
    - name: Attest build provenance (ghcr.io)
      uses: actions/attest@v4
      with:
        subject-name: ghcr.io/n42-gateway/n42-gateway
        subject-digest: ${{ steps.build.outputs.digest }}
        subject-version: ${{ env.GIT_TAG }}
        push-to-registry: true
    - name: Attest build provenance (quay.io)
      uses: actions/attest@v4
      with:
        subject-name: quay.io/n42-gateway/n42-gateway
        subject-digest: ${{ steps.build.outputs.digest }}
        subject-version: ${{ env.GIT_TAG }}
        push-to-registry: true
    # The signed SBOM is BuildKit's linux/amd64 one: an attestation subject
    # is the index, which has one SBOM per platform. Every platform builds
    # the same Dockerfile, so they list the same packages and Go modules.
    - name: Extract SBOM
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
      run: |
        docker buildx imagetools inspect "ghcr.io/n42-gateway/n42-gateway@${DIGEST}" \
          --format '{{ json (index .SBOM "linux/amd64").SPDX }}' > "${RUNNER_TEMP}/sbom.spdx.json"
    - name: Attest SBOM (ghcr.io)
      uses: actions/attest@v4
      with:
        subject-name: ghcr.io/n42-gateway/n42-gateway
        subject-digest: ${{ steps.build.outputs.digest }}
        sbom-path: ${{ runner.temp }}/sbom.spdx.json
        push-to-registry: true
        create-storage-record: false
    - name: Attest SBOM (quay.io)
      uses: actions/attest@v4
      with:
        subject-name: quay.io/n42-gateway/n42-gateway
        subject-digest: ${{ steps.build.outputs.digest }}
        sbom-path: ${{ runner.temp }}/sbom.spdx.json
        push-to-registry: true
        create-storage-record: false
